<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Animated Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #c084fc; #34d399; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #c084fc; #34d399; #38bdf8; #818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399; #38bdf8; #818cf8; #c084fc; #34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #a78bfa; #34d399; #38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 4;
        animation: dash 20s linear infinite;
      }
      .float-card {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: float 4.5s ease-in-out 1s infinite alternate;
      }
      .float-card-3 {
        animation: float 5s ease-in-out 2s infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="160" fill="#38bdf8" fill-opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="cx" values="150; 220; 150" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="320" r="180" fill="#818cf8" fill-opacity="0.1" filter="url(#softGlow)">
    <animate attributeName="cy" values="320; 260; 320" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="650" cy="200" r="120" fill="#10b981" fill-opacity="0.08" filter="url(#softGlow)" />

  <!-- Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- FinOps Constellation Lines & Dynamic Waves -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5">
    <path d="M 0 350 Q 300 280, 600 330 T 1200 290" fill="none" class="wave-line" />
    <path d="M 0 320 Q 350 380, 700 290 T 1200 340" fill="none" stroke="#818cf8" stroke-opacity="0.25" class="wave-line" />
    <path d="M 0 380 Q 400 310, 800 360 T 1200 310" fill="none" stroke="#34d399" stroke-opacity="0.15" class="wave-line" />
  </g>

  <!-- Header Category Tag -->
  <g transform="translate(60, 50)">
    <rect width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981">
      <animate attributeName="r" values="4; 6; 4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.7; 1; 0.7" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED FINOPS DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="130" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Reserved Instance Management
  </text>

  <!-- Subtitle -->
  <text x="60" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
    Cloud Commitment Automation • Savings Plans • Spot Orchestration • FinOps Tooling
  </text>

  <!-- Multi-Cloud Ecosystem Badges -->
  <g transform="translate(60, 205)">
    <!-- AWS Badge -->
    <rect width="105" height="28" rx="6" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-opacity="0.5" stroke-width="1" />
    <text x="14" y="18" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">AWS RIs &amp; SPs</text>

    <!-- Azure Badge -->
    <rect x="115" width="135" height="28" rx="6" fill="#0078d4" fill-opacity="0.15" stroke="#0078d4" stroke-opacity="0.5" stroke-width="1" />
    <text x="127" y="18" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Azure Reservations</text>

    <!-- GCP Badge -->
    <rect x="260" width="100" height="28" rx="6" fill="#4285f4" fill-opacity="0.15" stroke="#4285f4" stroke-opacity="0.5" stroke-width="1" />
    <text x="272" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">GCP CUDs</text>

    <!-- Kubernetes Badge -->
    <rect x="370" width="125" height="28" rx="6" fill="#326ce5" fill-opacity="0.15" stroke="#326ce5" stroke-opacity="0.5" stroke-width="1" />
    <text x="382" y="18" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Kubernetes FinOps</text>

    <!-- Spot Badge -->
    <rect x="505" width="125" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <text x="517" y="18" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Spot Automation</text>
  </g>

  <!-- Interactive Data KPI Cards (Right Side) -->
  <!-- Card 1: Max Savings -->
  <g class="float-card" transform="translate(860, 45)">
    <rect width="280" height="95" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" filter="url(#glow)" />
    <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">EFFECTIVE SAVINGS RATE</text>
    <text x="20" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="800">Up to 72%</text>
    <path d="M 215 65 L 230 45 L 245 55 L 265 35" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 50; 50 0; 0 50" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Card 2: Autonomous Rebalancing -->
  <g class="float-card-2" transform="translate(860, 160)">
    <rect width="280" height="95" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" filter="url(#glow)" />
    <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">COMMITMENT PORTFOLIO</text>
    <text x="20" y="70" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">24/7 Autonomous</text>
    <circle cx="245" cy="58" r="12" fill="#818cf8" fill-opacity="0.2" />
    <circle cx="245" cy="58" r="6" fill="#818cf8">
      <animate attributeName="r" values="4; 8; 4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Card 3: Multi-Cloud Market Coverage -->
  <g class="float-card-3" transform="translate(860, 275)">
    <rect width="280" height="95" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" filter="url(#glow)" />
    <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ECOSYSTEM TRACKED</text>
    <text x="20" y="70" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="800">SaaS &amp; Open Source</text>
    <path d="M 230 65 L 245 48 L 260 55" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Bottom Metrics Strip -->
  <g transform="translate(60, 280)">
    <rect width="760" height="90" rx="12" fill="#0b1329" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
    
    <!-- Mini Metric 1 -->
    <g transform="translate(25, 20)">
      <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">MARKET SECTOR</text>
      <text x="0" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">$7.8B–$15B FinOps</text>
    </g>

    <!-- Separator 1 -->
    <line x1="240" y1="20" x2="240" y2="70" stroke="#1e293b" stroke-width="1" />

    <!-- Mini Metric 2 -->
    <g transform="translate(265, 20)">
      <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">MARKET STRUCTURE</text>
      <text x="0" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Moderately Fragmented</text>
    </g>

    <!-- Separator 2 -->
    <line x1="510" y1="20" x2="510" y2="70" stroke="#1e293b" stroke-width="1" />

    <!-- Mini Metric 3 -->
    <g transform="translate(535, 20)">
      <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">TOP OPEN SOURCE</text>
      <text x="0" y="44" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">12.5k+ Stars (Infracost)</text>
    </g>
  </g>
</svg>
